spring.application.name=trial-task

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:h2:file:./.data/db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

weather.cron=${WEATHER_CRON}
weather.source-uri=${WEATHER_SOURCE_URI}
weather.connect-timeout=${WEATHER_CONNECT_TIMEOUT_SEC}
weather.read-timeout=${WEATHER_READ_TIMEOUT_SEC}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.paths-to-match=/api/**

logging.level.org.flywaydb=DEBUG
logging.level.org.springframework.boot.flyway=DEBUG